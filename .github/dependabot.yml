# P7.4 supply chain: automated dependency update PRs.
# - npm: weekly, grouped to keep PR noise low; security updates arrive as
#   individual PRs regardless of grouping.
# - github-actions: keeps the SHA-pinned `uses:` lines fresh (Dependabot
#   updates the pinned commit and the trailing version comment together).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
