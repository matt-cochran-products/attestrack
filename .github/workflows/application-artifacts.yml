# Application BYTES only: no provider, environment, OPV, bootstrap or acceptance authority.
name: Retained application artifacts
on:
  push:
    branches: [staging, main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: application-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node scripts/application-artifacts.ts scope
        env:
          GH_TOKEN: ${{ github.token }}
  staging-build:
    needs: scope
    if: github.ref == 'refs/heads/staging'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node scripts/application-artifacts.ts build
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attestrack-application-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestrack-application/application.json
          if-no-files-found: error
          retention-days: 90
  main-materialize:
    needs: scope
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node scripts/application-artifacts.ts materialize
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-materialization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestrack-application/original-artifact.json
          if-no-files-found: error
          retention-days: 90
