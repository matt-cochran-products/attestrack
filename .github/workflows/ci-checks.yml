name: CI
on:
  workflow_call:

# Reusable workflow: `github.*` is the caller's original event context. Source
# builds run only for non-draft PRs into dev/staging, or dispatch/push on
# refs/heads/dev or refs/heads/staging — never main and never an unknown event
# (the reused e2e.yml applies the same expression to its own job).
# Tested by scripts/retained-workflow.test.ts.
jobs:
  ci:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'staging')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')) }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/retained-build.test.ts scripts/retained-workflow.test.ts
      - run: pnpm audit-gate
      - run: pnpm typecheck
      - run: pnpm lint
      # `pnpm test` includes the e2e api-smoke project, which runs against REAL
      # workerd via `wrangler dev` (e2e/worker). A11y component suites
      # (vitest-axe: consent banner, portal dialogs/empty states) run here too.
      - run: pnpm test
      # P6.1 — worker-core runtime contract tests inside actual workerd
      # (@cloudflare/vitest-pool-workers): KV TTL semantics, waitUntil,
      # cf-ipcountry, Set-Cookie.
      - run: pnpm test:workers
      # P6.4 — coverage thresholds (≥85% line) scoped to the consent + explore
      # paths in sdk / schema / strategies / worker-core.
      - run: pnpm coverage
      - run: pnpm route-contract-check
      - run: pnpm build
      # size-check covers the consent bundle budget (size-limit) AND the
      # scaffold worker bundle gzip budget (scripts/worker-size-check.mjs).
      - run: pnpm size-check
      - run: pnpm boundary-check
      - run: pnpm egress-check

  # P1.5 — ingest → warehouse round-trip against a REAL ClickHouse: applies the
  # repo-shipped DDL (packages/schema/warehouse/clickhouse.sql), inserts through
  # the actual strategy path (INSERT INTO events FORMAT JSONEachRow +
  # date_time_input_format=best_effort, Basic auth), reads back both raw and
  # through the Explore SQL gate → executor. Kept out of `pnpm test` on purpose:
  # the default pipeline needs no ClickHouse; this job provides one.
  warehouse:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'staging')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')) }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3.18.7
        env:
          # The image only admits the passwordless `default` user from
          # localhost; the runner connects over the mapped port (remote), so a
          # real user is required — and it exercises the Worker's Basic-auth
          # path. Throwaway CI-only credentials, not secrets.
          CLICKHOUSE_USER: attestrack
          CLICKHOUSE_PASSWORD: attestrack-test
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user attestrack --password attestrack-test --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The integration test imports built workspace deps (strategies/schema/sdk).
      - run: pnpm build
      - run: pnpm test:warehouse
        env:
          CLICKHOUSE_TEST_HTTP_URL: http://localhost:8123
          CLICKHOUSE_TEST_USER: attestrack
          CLICKHOUSE_TEST_PASSWORD: attestrack-test

  # Playwright against workerd (api-smoke + Chromium browser journeys). The
  # reused workflow gates its own job on the same event context; it takes no
  # inputs and receives no secrets.
  e2e:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'staging')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')) }}
    uses: ./.github/workflows/e2e.yml

  build-gate:
    name: Build gate
    needs:
    - ci
    - warehouse
    - e2e
    # Always evaluates; an ineligible context, or anything but success from
    # each of ci, warehouse and e2e (missing, skipped, cancelled, failure), fails.
    if: ${{ always() }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      BUILD_RESULTS: ${{ toJSON(needs) }}
      BUILD_ELIGIBLE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'staging')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/validate-ci-runner
      with:
        mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
        runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
    - name: Require successful build checks
      run: |
        python3 - <<'PY'
        import json, os, sys
        if os.environ.get("BUILD_ELIGIBLE") != "true":
            print("Build gate failed: ineligible event context for source build checks")
            sys.exit(1)
        results = json.loads(os.environ["BUILD_RESULTS"])
        required = ("ci", "warehouse", "e2e")
        if not isinstance(results, dict) or set(results) != set(required):
            print("Build gate failed: expected exactly", required, "got", results)
            sys.exit(1)
        outcome = {name: results[name].get("result") if isinstance(results[name], dict) else None for name in required}
        if any(result != "success" for result in outcome.values()):
            print("Build gate failed:", outcome)
            sys.exit(1)
        print("ci, warehouse and e2e succeeded")
        PY
