name: E2E Tests
on:
  workflow_call:

# Reusable workflow, called only from ci-checks.yml: `github.*` is the caller's
# original event context and this workflow declares no inputs, so the source build
# runs only for non-draft PRs into dev/staging, or dispatch/push on
# refs/heads/dev or refs/heads/staging — never main and never an unknown event.
# Tested by scripts/retained-workflow.test.ts.
jobs:
  e2e:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'staging')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')) }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @attestrack/e2e exec playwright install --with-deps chromium
      # Live-mode portal build served by the e2e page host (same-origin proxy
      # to the workerd worker — mirrors the production hostname topology).
      - run: pnpm --filter @attestrack/e2e build:portal-live
      # Both projects run against workerd (`wrangler dev`): request-only smoke,
      # then browser journeys (consent grant/decline/GPC cross-origin, Explore
      # round-trip, portal live-mode smoke, banner + portal axe/keyboard a11y).
      - run: pnpm --filter @attestrack/e2e test
      - run: pnpm --filter @attestrack/e2e test:browser
