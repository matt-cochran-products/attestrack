name: Mutation (Explore SQL gate)

# Mutation testing is deeper (and slower) than the unit suite, so it does NOT
# gate every PR — the fast `pnpm test` in ci.yml stays the PR gate. This runs
# nightly and on demand, scoped to the INV-B-15 Explore SQL gate
# (packages/schema/src/explore-sql.ts). A surviving mutant is a candidate
# allowlist/keyword-gate bypass the tests don't pin down; `stryker run` exits
# non-zero when mutation score drops below the configured break threshold.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC nightly
  workflow_dispatch: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker runs vitest directly against source, which resolves the
      # workspace deps (@attestrack/types) via their built dist — so the deps
      # must be built first (turbo's normal `pnpm test` does this implicitly;
      # this job does not go through turbo).
      - run: pnpm --filter @attestrack/schema^... build
      - name: Stryker — Explore SQL gate
        run: pnpm --filter @attestrack/schema mutation
