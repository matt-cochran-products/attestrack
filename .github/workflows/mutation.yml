name: Mutation (core packages)

# Mutation testing is deeper (and slower) than the unit suite, so it does NOT
# gate every PR — the fast `pnpm test` in ci.yml stays the PR gate. This runs
# nightly and on demand across the security/correctness-critical packages:
#   - schema: the INV-B-15 Explore SQL gate (its own high bar) + all
#     consent/tracking/portal validators (stryker.schemas.conf.json)
#   - sdk: consent token mint/verify, gate semantics, delivery recording
#   - strategies: the mandatory consent pipeline, sinks and ad destinations
#   - worker-core: request-path routing, portal API, CORS, warehouse executor
# A surviving mutant on these surfaces is a candidate consent/gate bypass the
# tests don't pin down; `stryker run` exits non-zero when the mutation score
# drops below the per-package break threshold (see each stryker.conf.json,
# which also documents the accepted equivalent survivors).
on:
  workflow_dispatch: {}

concurrency:
  group: build-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Manual source builds are admitted for refs/heads/dev and refs/heads/staging
  # only; main or any other event/ref fails here, before any checkout or
  # install, and the whole matrix needs it. No token permissions, no secrets.
  # Tested by scripts/retained-workflow.test.ts.
  admission:
    name: Ref admission
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Admit dev or staging only
        env:
          ADMISSION_EVENT: ${{ github.event_name }}
          ADMISSION_REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$ADMISSION_EVENT:$ADMISSION_REF" in
            workflow_dispatch:refs/heads/dev|workflow_dispatch:refs/heads/staging)
              echo "Mutation admitted for $ADMISSION_REF" ;;
            *)
              echo "Mutation admission failed: $ADMISSION_EVENT on $ADMISSION_REF is not dev/staging dispatch" >&2
              exit 1 ;;
          esac

  mutation:
    needs: admission
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        package: [schema, sdk, strategies, worker-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-ci-runner
        with:
          mode: ${{ vars.CI_RUNNER_MODE || 'github' }}
          runner-label: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'github' }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker runs vitest directly against source, which resolves the
      # workspace deps (@attestrack/types etc.) via their built dist — so the
      # deps must be built first (turbo's normal `pnpm test` does this
      # implicitly; this job does not go through turbo).
      - run: pnpm --filter @attestrack/${{ matrix.package }}^... build
      - name: Stryker — ${{ matrix.package }}
        run: pnpm --filter @attestrack/${{ matrix.package }} mutation
