name: Publish
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # TODO: configure per-package npm publish
      # P7.4/P5.4: publish MUST use npm provenance (`pnpm publish --provenance`);
      # the id-token: write permission above exists for that. @attestrack npm
      # scope hygiene (2FA required, provenance-only) is a maintainer action —
      # see docs/THREAT-MODEL.md (Supply chain).
